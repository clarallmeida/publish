*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--text);
  font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select,textarea{font:inherit;color:inherit}
input[type=checkbox]{accent-color:var(--pink)}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ============ header ============ */
header.site{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hbar{max-width:1400px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.logo b{font-size:22.9px;font-weight:600;letter-spacing:-.025em}
nav.main{display:flex;gap:4px;margin-left:14px}
nav.main button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--muted);
  font-size:15.4px;font-weight:500;cursor:pointer;transition:.16s}
nav.main button:hover{color:var(--text);background:var(--surface)}
nav.main button.on{color:var(--text);background:var(--surface)}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
select.lang{appearance:none;background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:8px 30px 8px 13px;font-size:14.3px;font-weight:500;cursor:pointer;color:var(--muted);
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.btn{border:0;border-radius:999px;padding:10px 20px;font-size:15.4px;font-weight:500;cursor:pointer;transition:.16s;white-space:nowrap}
/* actions */
.btn.primary{background:var(--pink);color:#0A1E3F;font-weight:500}
.btn.primary:hover{background:#FF4FC0}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--text);border-color:var(--muted)}
.btn.lime{background:var(--lime);color:#0A1E3F}
.btn.lime:hover{filter:brightness(.94)}
.btn.big{padding:14px 28px;font-size:16.5px}
.btn.plus{display:inline-flex;align-items:center;gap:8px}
.btn.plus .pl{font-size:20.9px;line-height:0;font-weight:400;margin-top:-1px}

.burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:13px;
  background:var(--ground);cursor:pointer;align-items:center;justify-content:center;padding:0;flex:none}
.burger i{display:block;width:19px;height:2px;background:var(--text);border-radius:2px;position:relative}
.burger i:before,.burger i:after{content:"";position:absolute;left:0;width:19px;height:2px;
  background:var(--text);border-radius:2px}
.burger i:before{top:-6px}.burger i:after{top:6px}
body.menu-open .burger i{background:transparent}
body.menu-open .burger i:before{top:0;transform:rotate(45deg)}
body.menu-open .burger i:after{top:0;transform:rotate(-45deg)}
.mnav{display:none;position:fixed;left:0;right:0;top:var(--hh,58px);bottom:0;background:var(--ground);
  z-index:60;padding:14px 20px 40px;overflow-y:auto;flex-direction:column}
.mnav.on{display:flex}
body.menu-open{overflow:hidden}
.mnav .mlink{text-align:left;background:none;border:0;border-bottom:1px solid var(--line-soft);
  padding:17px 2px;font-size:21px;font-weight:500;color:var(--text);cursor:pointer}
.langpills{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}
.langpill{border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;background:none;
  font-size:14.5px;color:var(--muted);cursor:pointer}
.langpill.on{border-color:var(--pink);color:var(--text);background:color-mix(in srgb,var(--pink) 10%,var(--ground))}
.sheetgrip{display:none}

/* ============ shared ============ */
.page{display:none}
.page.on{display:block}
.col{max-width:1000px;margin:0 auto;padding:0 22px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12.1px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--blue);font-weight:500}
h1{font-size:clamp(30px,4.6vw,52px);line-height:1.06;letter-spacing:-.035em;font-weight:600;margin:14px 0 0;text-wrap:balance}
h2{font-size:clamp(23px,2.8vw,31px);line-height:1.15;letter-spacing:-.028em;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:18.7px;line-height:1.3;letter-spacing:-.015em;font-weight:600;margin:0}
.lead{font-size:clamp(17px,1.8vw,21px);line-height:1.6;color:var(--muted);max-width:62ch;font-weight:300}
p{margin:0}

/* ============ HOME ============ */
.hero{padding:26px 0 22px;border-bottom:1px solid var(--line)}
.hero .col{display:block;max-width:1400px}
.hero h1{margin:0;font-size:clamp(21px,2.5vw,34px);letter-spacing:-.03em}
@media(min-width:760px){.hero h1{white-space:nowrap}}
.hero .lead{margin-top:11px;max-width:52ch;font-size:17.1px}
.searchwrap{position:relative;max-width:440px;margin-top:20px}
.searchwrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.45}
input.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  padding:13px 18px 13px 44px;font-size:16px;transition:.16s}
input.search:focus{border-color:var(--pink);background:var(--raise);outline:none}
input.search::placeholder{color:var(--faint)}
#qclear{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;
  width:26px;height:26px;border-radius:50%;border:0;background:var(--line-soft);color:var(--muted);
  cursor:pointer;place-items:center;padding:0}
#qclear:hover{background:var(--line);color:var(--text)}
.searchwrap.filled #qclear{display:grid}
input.search{padding-right:46px}
#sug{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--raise);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;z-index:30;display:none}
#sug.on{display:block}
.sugit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:11px 16px;cursor:pointer;font-size:15.4px;color:var(--text);border-bottom:1px solid var(--line-soft)}
.sugit:last-child{border-bottom:0}
.sugit:hover,.sugit.act{background:var(--surface)}
.sugit b{font-weight:600}
.sugit .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.sugit .k{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);
  letter-spacing:.08em;text-transform:uppercase}

.filterbar{border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:57px;z-index:20}
.filterbar .in{max-width:1400px;margin:0 auto;padding:13px 22px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#chips{display:flex;gap:9px;flex-wrap:wrap}
.flabel{font-family:"IBM Plex Mono",monospace;font-size:12.1px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--ground);
  border-radius:999px;padding:7px 15px 7px 10px;font-size:14.9px;font-weight:500;color:var(--muted);cursor:pointer;transition:.16s}
.chip .dot{width:11px;height:11px;border-radius:50%;background:var(--d);flex:none}
.chip .cico{width:22px;height:22px;border-radius:50%;background:var(--d);display:grid;place-items:center;flex:none}
.chip .cico svg{width:15px;height:15px;display:block}
.chip:not([aria-pressed="true"]) .cico{background:var(--faint)}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--d);background:color-mix(in srgb,var(--d) 13%,var(--ground))}
.chip:not([aria-pressed="true"]) .dot{background:var(--faint)}
.chip .n{font-family:"IBM Plex Mono",monospace;font-size:12.7px;color:var(--faint)}
.linkbtn{background:none;border:0;color:var(--pink);font-size:14.3px;font-weight:500;cursor:pointer;padding:6px 4px}
.linkbtn:hover{text-decoration:underline}

.explore{display:grid;grid-template-columns:1fr 370px;height:min(76vh,760px);min-height:520px}
.mapwrap{position:relative;background:var(--m-paper);overflow:hidden;display:flex;align-items:center;
  justify-content:center;height:100%;cursor:grab;touch-action:none}
.mapwrap.dragging{cursor:grabbing}
.mapctl{position:absolute;right:16px;bottom:56px;display:flex;flex-direction:column;gap:1px;
  border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.22);z-index:5}
.mapctl button{width:36px;height:36px;border:0;background:var(--ground);color:var(--text);font-size:19px;
  line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.mapctl button:hover{background:var(--surface)}
svg.map{display:block;width:100%;height:100%}
.overlay{position:absolute;pointer-events:none;font-family:"IBM Plex Mono",monospace;font-size:12.1px;color:var(--muted)}
.ov-count{top:16px;left:18px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;letter-spacing:.04em}
.ov-compass{top:16px;right:18px;text-align:center;line-height:1}
.ov-scale{bottom:16px;left:18px}
.ov-scale .bar{display:flex;align-items:flex-end;gap:0;margin-top:4px}
.ov-scale .seg{width:26px;height:6px;border:1px solid var(--muted);border-right:0}
.ov-scale .seg:nth-child(odd){background:var(--muted)}
.ov-scale .seg:last-child{border-right:1px solid var(--muted)}
.ov-hint{bottom:16px;right:18px}

.pin{cursor:pointer}
.pin{transition:opacity .45s ease}
.pin .body{transition:transform .5s cubic-bezier(.28,1.3,.42,1);transform-origin:center;transform-box:fill-box}
.pin .lead,.pin .fname,.pin .ftype{transition:opacity .45s ease}
.pin.off{opacity:.07;pointer-events:none}
.pin.off .body{transform:scale(.35)}
.pin.off .lead,.pin.off .fname,.pin.off .ftype{opacity:0}
.pin:hover .body,.pin.sel .body{transform:scale(1.16)}
.pin .hit{fill:transparent}
.pin .lead{stroke-width:calc(1.4px / var(--z,1));opacity:.55;fill:none}
.plabel{font-size:calc(13px / var(--z,1));font-weight:600;fill:var(--text);paint-order:stroke;stroke:var(--m-land);stroke-width:calc(5px / var(--z,1));
  stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .16s}
.pin:hover .plabel,.pin.sel .plabel,.pin.named .plabel{opacity:1}
#hoverlbl{pointer-events:none}
.hbg{fill:var(--m-land);stroke-width:calc(1.8px / var(--z,1))}
.hname{font-size:calc(15.5px / var(--z,1));font-weight:700;fill:var(--text)}
.htype{font-size:calc(12.5px / var(--z,1));fill:var(--muted)}
.pin:hover .fname,.pin.sel .fname,.pin:hover .ftype,.pin.sel .ftype{opacity:0}
.fname{font-size:calc(13.5px / var(--z,1));font-weight:600;fill:var(--text);paint-order:stroke;stroke:var(--m-land);
  stroke-width:calc(4.5px / var(--z,1));stroke-linejoin:round;pointer-events:none}
.ftype{font-size:calc(11.5px / var(--z,1));fill:var(--muted);paint-order:stroke;stroke:var(--m-land);stroke-width:calc(4px / var(--z,1));
  stroke-linejoin:round;pointer-events:none}
.route{fill:none;stroke-width:calc(3.4px / var(--z,1));stroke-linecap:round;stroke-linejoin:round;opacity:.55;stroke-dashoffset:0;
  transition:stroke-dashoffset 1.5s cubic-bezier(.42,0,.18,1),opacity .5s ease}
.route.off{opacity:0;stroke-dashoffset:var(--len)}
.route.dim{opacity:.14}
.dlabel{font-family:"IBM Plex Mono",monospace;font-size:calc(12.5px / var(--z,1));font-weight:500;fill:var(--m-label);letter-spacing:1.4px}

/* rail */
.rail{border-left:1px solid var(--line);background:var(--ground);display:flex;flex-direction:column;height:100%;min-height:0}
.railhead{padding:16px 20px 12px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:8px}
.railhead .t{font-size:13.2px;font-family:"IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.railhead .c{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:13.2px;color:var(--muted)}
.raillist{overflow-y:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line-soft);
  cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;transition:background .14s}
.item:hover{background:var(--surface)}
.item.sel{background:color-mix(in srgb,var(--c) 11%,var(--ground));box-shadow:inset 3px 0 0 var(--c)}
.item .dot{width:11px;height:11px;border-radius:50%;background:var(--c);margin-top:6px}
.item .nm{display:block;font-size:16px;font-weight:500;line-height:1.35}
.item .mt{display:block;font-size:13.8px;color:var(--muted);margin-top:2px}
.emptyrail{padding:34px 22px;color:var(--muted);font-size:15.4px;line-height:1.6}

.detail{padding:20px;overflow-y:auto;flex:1}
.detail .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--pink);
  font-size:14.3px;font-weight:500;cursor:pointer;padding:0;margin-bottom:16px}
.catpill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px 5px 9px;
  font-size:13.2px;font-weight:500;background:color-mix(in srgb,var(--c) 16%,var(--ground));color:var(--text)}
.catpill .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.detail h3{margin:12px 0 4px;font-size:21.8px;letter-spacing:-.02em}
.detail .meta{font-family:"IBM Plex Mono",monospace;font-size:13.2px;color:var(--muted);letter-spacing:.03em}
.detail .desc{font-size:15.4px;color:var(--muted);margin:14px 0;line-height:1.65}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tag{font-size:12.7px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.detail .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.connbox{margin-top:20px;border-top:1px solid var(--line-soft);padding-top:16px}
.connbox .h{font-family:"IBM Plex Mono",monospace;font-size:12.1px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.connrow{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14.9px;background:none;border:0;cursor:pointer;width:100%;text-align:left}
.connrow:hover{color:var(--pink)}
.connrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.connrow .d{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12.7px;color:var(--faint)}

/* strip under map */
.strip{border-top:1px solid var(--line);background:var(--surface)}
.strip .col{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px;padding-top:0;padding-bottom:0;max-width:1400px}
.stat{padding:26px 22px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:31.2px;font-weight:500;letter-spacing:-.02em;line-height:1}
.stat .k{font-size:14.3px;color:var(--muted);margin-top:6px}

.evrow{display:grid;grid-template-columns:70px 1fr auto;gap:22px;align-items:center;
  padding:18px 6px;border-bottom:1px solid var(--line)}
.evrow:first-child{border-top:1px solid var(--line)}
.evdate{text-align:center}
.evdate .dd{font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.evdate .mm{font-family:"IBM Plex Mono",monospace;font-size:11.6px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-top:5px}
.evrow h3{font-size:18.2px}
.evmeta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:14.3px;color:var(--muted);margin-top:5px}
.evmeta .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.evkind{font-size:12.1px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted)}
.evkind.call{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 18%,var(--ground));color:var(--lime-ink)}
@media(max-width:640px){.evrow{grid-template-columns:56px 1fr;gap:14px}.evrow .btn{grid-column:2}}

/* ============ ABOUT ============ */
.sect{padding:64px 0}
.sect.tight{padding:44px 0}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:28px}
.layer{background:var(--ground);padding:24px 22px 28px}
.layer .bar{width:34px;height:5px;border-radius:99px;background:var(--c)}
.layer h3{margin:16px 0 8px;font-size:17.6px}
.layer p{font-size:14.9px;color:var(--muted);line-height:1.6}
.layer .n{font-family:"IBM Plex Mono",monospace;font-size:12.7px;color:var(--faint);margin-top:14px;display:block}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:32px;margin-top:30px}
.step .num{font-family:"IBM Plex Mono",monospace;font-size:13.2px;color:var(--blue);letter-spacing:.1em}
.step h3{margin:10px 0 8px}
.step p{color:var(--muted);font-size:15.4px}
.quote{background:var(--navy);color:#fff;border-radius:22px;padding:clamp(34px,5vw,62px);
  position:relative;overflow:hidden}
.weavebg{position:absolute;inset:0;width:100%;height:100%;opacity:.92;pointer-events:none}
.quote::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,var(--navy) 20%,color-mix(in srgb,var(--navy) 78%,transparent) 50%,
             transparent 74%)}
.qtext{position:relative;z-index:2}
@media(max-width:760px){.quote::after{background:linear-gradient(180deg,var(--navy) 34%,
  color-mix(in srgb,var(--navy) 72%,transparent) 62%,transparent 88%)}}
.quote q{font-size:clamp(21px,3.2vw,32px);line-height:1.28;font-weight:300;letter-spacing:-.02em;display:block;max-width:22ch;quotes:none}
.quote .who{font-family:"IBM Plex Mono",monospace;font-size:12.7px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sky);margin-top:24px}
.weave{position:absolute;inset:0;opacity:.16;pointer-events:none}

/* ============ PROFILE ============ */
.cover{height:150px;background:color-mix(in srgb,var(--c) 26%,var(--ground));position:relative;overflow:hidden;
  border-radius:20px;margin-top:20px}
.profhead{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-top:-40px;padding:0 24px;position:relative}
.profmark{width:78px;height:78px;border-radius:22px;background:var(--c);border:5px solid var(--ground);flex:none;
  display:grid;place-items:center;font-size:28.1px;font-weight:600;color:#fff}
.profmark.dark{color:#0A1E3F}
.proftitle{padding-top:44px}
.proftitle h1{font-size:clamp(26px,3.6vw,36px);margin:0}
.proftitle .meta{font-family:"IBM Plex Mono",monospace;font-size:14.3px;color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:40px;margin-top:38px;align-items:start}
.card{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--ground)}
.card + .card{margin-top:16px}
.card .h{font-family:"IBM Plex Mono",monospace;font-size:12.1px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14.9px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.callcard{border:1.5px solid var(--lime);border-radius:18px;padding:22px;background:color-mix(in srgb,var(--lime) 9%,var(--ground))}
.canlist{list-style:none;margin:0;padding:0}
.canlist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px;line-height:1.5}
.canlist li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;margin-top:9px}
.srcnote{font-size:12.5px;color:var(--faint);margin-top:14px;line-height:1.55}
.kv a{color:var(--pink);text-decoration:none}
.kv a:hover{text-decoration:underline}
.demo{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11.6px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);
  border-radius:999px;padding:4px 11px}

.login{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 58px)}
.loginform{display:flex;align-items:center;justify-content:center;padding:clamp(30px,5vw,64px)}
.loginform .in{width:100%;max-width:390px}
.loginside{position:relative;overflow:hidden;background:var(--navy);color:#fff;
  display:flex;align-items:flex-end;padding:clamp(28px,4vw,54px)}
.loginside::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(20deg,var(--navy) 26%,color-mix(in srgb,var(--navy) 76%,transparent) 56%,transparent 92%)}
.loginside .sq{position:relative;z-index:2;max-width:20ch;font-weight:300;letter-spacing:-.02em;
  font-size:clamp(21px,2.2vw,30px);line-height:1.25}
@media(max-width:800px){.login{grid-template-columns:1fr;min-height:0}
  .loginside{min-height:240px;order:-1}}

/* ============ JOIN ============ */
.joinhero{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:60px 0 66px}
.joinhero h1{color:#fff}
.joinhero .lead{color:#B9CDE4}
.joinhero .eyebrow{color:var(--lime)}
.joinhero .col{position:relative}
.formgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:44px;margin-top:-34px;position:relative;z-index:2;align-items:start}
.formcard{background:var(--ground);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3vw,34px);box-shadow:var(--shadow)}
.stepsline{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}
.stepdot{display:flex;align-items:center;gap:8px;font-size:13.8px;color:var(--faint);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.stepdot.on{color:var(--text);border-color:var(--blue);background:color-mix(in srgb,var(--blue) 9%,var(--ground))}
.stepdot b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--blue)}
.field{margin-bottom:18px}
.field > label{display:block;font-size:13.8px;font-weight:500;color:var(--muted);margin-bottom:7px}
.field input[type=text],.field input[type=email],.field input[type=password],.field select,.field textarea{
  width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.field textarea{min-height:96px;resize:vertical;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);background:var(--raise);outline:none}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.catopt{border:1.5px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;display:flex;gap:9px;align-items:flex-start;transition:.16s}
.catopt:hover{border-color:var(--muted)}
.catopt input{margin:3px 0 0}
.catopt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--ground))}
.catopt .nm{font-size:14.9px;font-weight:500;line-height:1.3}
.pillset{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1.5px solid var(--line);background:var(--ground);border-radius:999px;padding:7px 14px;font-size:14.3px;
  color:var(--muted);cursor:pointer;transition:.16s}
.pill[aria-pressed="true"]{border-color:var(--blue);color:var(--text);background:color-mix(in srgb,var(--blue) 10%,var(--ground))}
.aside .card{background:var(--surface)}
@media(min-width:1001px){.aside{position:sticky;top:80px}}
.benefit{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.9px;line-height:1.55}
.benefit:last-child{border-bottom:0}
.benefit .b{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px}
.done{text-align:center;padding:40px 20px}
.done .mk{width:60px;height:60px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 18px}

/* ============ footer ============ */
footer.site{background:var(--navy);color:#fff;margin-top:0;position:relative;overflow:hidden}
footer.site::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(155deg,var(--navy) 40%,color-mix(in srgb,var(--navy) 82%,transparent) 66%,
             color-mix(in srgb,var(--navy) 30%,transparent) 100%)}
footer.site .weavebg{opacity:.85}
footer.site .col{position:relative;z-index:2;padding-top:52px;padding-bottom:34px}
.ftop{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:34px}
.ftag{font-size:15.4px;color:#9FB8D4;margin-top:14px;line-height:1.5;max-width:24ch;font-weight:300}
.fcol h4{font-family:"IBM Plex Mono",monospace;font-size:12.1px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--sky);margin:0 0 14px;font-weight:500}
.fcol button{display:block;background:none;border:0;color:#C6D8EC;font-size:14.9px;padding:5px 0;cursor:pointer;text-align:left}
.fcol button:hover{color:#fff}
.fbot{margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);display:flex;
  justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.8px;color:#A8BFD6}

@media(max-width:1000px){
  .explore{grid-template-columns:1fr}
  .explore{height:auto}
  .rail{border-left:0;border-top:1px solid var(--line);height:auto}
  .raillist{max-height:420px}
  .mapwrap{height:auto}
  svg.map{height:auto}
  .grid2,.formgrid{grid-template-columns:1fr;gap:26px}
  .ftop{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  nav.main{display:none}
  .hright>*:not(.burger){display:none}
  .burger{display:flex}
  .hbar{padding:10px 16px;gap:12px}
  .filterbar .in{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:11px 16px}
  .filterbar .in::-webkit-scrollbar{display:none}
  .filterbar .flabel{display:none}
  #chips{flex-wrap:nowrap}
  .filterbar .chip{flex:none}
  .filterbar .linkbtn{flex:none;margin-left:4px}
  .hero{padding:16px 0 14px}
  .hero h1{font-size:20px}
  .hero .col,.col{padding-left:16px;padding-right:16px}
  .explore{height:76dvh;min-height:460px;position:relative;display:block}
  .mapwrap{position:absolute;inset:0;height:100%}
  .rail{position:absolute;left:0;right:0;bottom:0;height:86%;border:0;border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;box-shadow:0 -10px 34px rgba(10,30,63,.20);z-index:20;
    transform:translateY(var(--sheet,calc(100% - 156px)));transition:transform .3s cubic-bezier(.3,.85,.4,1);
    touch-action:none;background:var(--ground)}
  .rail.dragging{transition:none}
  .sheetgrip{display:block;padding:11px 0 5px;cursor:grab;flex:none}
  .sheetgrip i{display:block;width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
  .strip .col{grid-template-columns:1fr 1fr}
  .mapctl{bottom:auto;top:16px;right:12px}
  .ov-scale,.ov-hint{display:none}
}
@media(max-width:700px){
  .hero .col{gap:24px}
  .searchwrap{max-width:none}
  .ftop{grid-template-columns:1fr}
  .filterbar{position:static}
}
</style>
</head>
<body>


<header class="site">
  <div class="hbar">
    <button class="logo" onclick="go('home')" aria-label="Plural home">
      <span class="mark" style="width:42px;height:42px;margin:-3px 0" role="img" aria-label="Plural"></span>
      <b>Plural</b>
    </button>
    <nav class="main">
      <button data-nav="home" onclick="go('home')" class="on" data-t="nav.map"></button>
      <button data-nav="events" onclick="go('events')" data-t="nav.events"></button>
      <button data-nav="calls" onclick="go('calls')" data-t="nav.calls"></button>
      <button data-nav="about" onclick="go('about')" data-t="nav.about"></button>
    </nav>
    <div class="hright">
      <select class="lang" id="lang" aria-label="Language">
        <option value="en">EN</option><option value="de">DE</option>
        <option value="pt">PT</option><option value="es">ES</option>
      </select>
      <button class="btn ghost" onclick="go('login')" data-t="nav.login"></button>
      <button class="burger" id="burger" onclick="toggleMenu()" aria-label="Menu" aria-expanded="false"><i></i></button>
      <button class="btn primary plus" onclick="go('join')"><span class="pl" aria-hidden="true">+</span><span data-t="nav.signup"></span></button>
    </div>
  </div>
</header>

<div class="mnav" id="mnav">
  <button class="mlink" onclick="mgo('home')" data-t="nav.map"></button>
  <button class="mlink" onclick="mgo('events')" data-t="nav.events"></button>
  <button class="mlink" onclick="mgo('calls')" data-t="nav.calls"></button>
  <button class="mlink" onclick="mgo('about')" data-t="nav.about"></button>
  <div class="langpills" id="langpills"></div>
  <button class="btn ghost" style="width:100%;justify-content:center;display:flex" onclick="mgo('login')" data-t="nav.login"></button>
  <button class="btn primary plus" style="width:100%;justify-content:center;margin-top:10px"
          onclick="mgo('join')"><span class="pl" aria-hidden="true">+</span><span data-t="nav.signup"></span></button>
</div>

<!-- ================= HOME ================= -->
<main>
<section class="page on" id="p-home">
  <div class="hero">
    <div class="col">
      <div style="flex:1;min-width:290px">
        <h1 data-t="home.eyebrow"></h1>
      </div>
      <div class="searchwrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6" stroke-linecap="round"/></svg>
        <input class="search" id="q" type="text" aria-label="Search" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="sug">
        <button type="button" id="qclear" aria-label="Clear search" onclick="clearSearch()">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M1.5 1.5 10.5 10.5 M10.5 1.5 1.5 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div id="sug" role="listbox"></div>
      </div>
    </div>
  </div>

  <div class="filterbar">
    <div class="in">
      <span class="flabel" data-t="home.filter"></span>
      <div id="chips"></div>
      <button class="linkbtn" id="showall" data-t="home.showall" style="margin-left:auto"></button>
    </div>
  </div>

  <div class="explore">
    <div class="mapwrap">
      <svg class="map" id="map" viewBox="0 0 1000 822" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of Berlin with cultural locations"></svg>
      <div class="overlay ov-count" id="ovcount"></div>
      <div class="overlay ov-compass">
        <svg width="15" height="26" viewBox="0 0 15 26" aria-hidden="true"><path d="M7.5 0 L13 12 L7.5 8.6 L2 12 Z" fill="currentColor"/></svg>
        <div style="margin-top:3px;font-weight:500">N</div>
      </div>
      <div class="overlay ov-scale">
        <div class="bar"><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i></div>
        <div style="display:flex;justify-content:space-between;width:104px;margin-top:3px"><span>0</span><span>8 km</span></div>
      </div>
      <div class="overlay ov-hint" id="ovhint"></div>
      <div class="mapctl">
        <button onclick="zoomBy(0.72)" aria-label="Zoom in">+</button>
        <button onclick="zoomBy(1.38)" aria-label="Zoom out">–</button>
        <button onclick="resetView()" aria-label="Whole city" title="Whole city">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>

    <aside class="rail">
      <div class="sheetgrip" id="grip"><i></i></div>
      <div id="railview" style="display:flex;flex-direction:column;min-height:0;flex:1"></div>
    </aside>
  </div>

  <div class="strip">
    <div class="col">
      <div class="stat"><div class="v" id="s1">33</div><div class="k" data-t="home.stat1"></div></div>
      <div class="stat"><div class="v">12</div><div class="k" data-t="home.stat2"></div></div>
      <div class="stat"><div class="v">4</div><div class="k" data-t="home.stat3"></div></div>
      <div class="stat"><div class="v">18</div><div class="k" data-t="home.stat4"></div></div>
    </div>
  </div>
</section>

<!-- ================= EVENTS ================= -->
<section class="page" id="p-events">
  <div class="sect col" style="padding-bottom:0">
    <div class="eyebrow" id="evEyebrow"></div>
    <h1 id="evTitle"></h1>
    <p class="lead" style="margin-top:18px" id="evLead"></p>
    <div style="margin-top:18px"><span class="demo" data-t="ev.demo"></span></div>
    <div class="pillset" id="evfilter" style="margin-top:22px"></div>
  </div>
  <div class="col" style="padding:26px 22px 70px">
    <div id="evlist"></div>
  </div>
</section>

<!-- ================= ABOUT ================= -->
<section class="page" id="p-about">
  <div class="sect col">
    <div class="eyebrow" data-t="about.eyebrow"></div>
    <h1 data-t="about.title"></h1>
    <p class="lead" style="margin-top:22px;max-width:34ch;font-size:clamp(19px,2.2vw,25px)" data-t="about.lead"></p>
  </div>

  <div class="col sect tight" style="padding-top:0">
    <h2 data-t="about.layersTitle"></h2>
    <div class="layers" id="layers"></div>
  </div>

  <div class="col sect tight">
    <h2 data-t="about.howTitle"></h2>
    <div class="steps" id="steps"></div>
  </div>

  <div class="col sect tight">
    <div class="quote">
      <svg class="weavebg" id="weaveart" viewBox="0 0 900 460"
           preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <div class="qtext">
        <q data-t="about.quote"></q>
        <div class="who" data-t="about.quoteWho"></div>
      </div>
    </div>
  </div>
</section>

<!-- ================= PROFILE ================= -->
<section class="page" id="p-place">
  <div class="col">
    <button class="linkbtn" onclick="go('home')" style="margin-top:22px;padding-left:0">← <span data-t="place.back"></span></button>
    <div class="cover" id="pcover"><svg class="weave" style="opacity:.5" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="weavecover"></svg></div>
    <div class="profhead">
      <div class="profmark" id="pmark"></div>
      <div class="proftitle">
        <h1 id="pname"></h1>
        <div class="meta" id="pmeta"></div>
      </div>
      <div style="margin-left:auto;padding-top:48px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" data-t="place.message"></button>
        <a class="btn ghost" id="pweb" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center" data-t="place.website"></a>
      </div>
    </div>

    <div class="grid2" style="padding:0 24px 60px">
      <div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="catpill" id="pcat"><span class="dot"></span><span></span></span>
          <span class="demo" id="pdemo" data-t="place.demo"></span>
        </div>
        <h2 style="margin:26px 0 12px;font-size:20.8px" data-t="place.aboutH"></h2>
        <p style="color:var(--muted);max-width:60ch" id="pabout"></p>
        <div class="tags" id="ptags" style="margin-top:20px"></div>

        <div class="card" id="pcanbox" style="margin-top:26px">
          <div class="h" data-t="place.canH"></div>
          <ul id="pcan" class="canlist"></ul>
        </div>
        <div class="callcard" id="pcall" style="margin-top:26px">
          <div class="h" style="font-family:'IBM Plex Mono',monospace;font-size:12.1px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime-ink);margin-bottom:10px" data-t="place.callH"></div>
          <h3 data-t="place.callTitle"></h3>
          <p style="color:var(--muted);font-size:15.4px;margin-top:8px;max-width:52ch" data-t="place.callDesc"></p>
          <button class="btn lime" style="margin-top:16px" data-t="place.callBtn"></button>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="h" data-t="place.practical"></div>
          <div id="pfacts"></div>
          <p class="srcnote" id="psrc"></p>
        </div>
        <div class="card">
          <div class="h" data-t="place.connH"></div>
          <div id="pconn"></div>
          <p style="font-size:13.8px;color:var(--faint);margin-top:12px;line-height:1.5" data-t="place.connNote"></p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ================= LOGIN ================= -->
<section class="page" id="p-login">
  <div class="login">
    <div class="loginform">
      <div class="in" id="logincard">
        <div class="eyebrow" data-t="log.eyebrow"></div>
        <h1 style="font-size:clamp(28px,3.4vw,40px);margin:12px 0 14px" data-t="log.title"></h1>
        <p style="color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:28px" data-t="log.lead"></p>
        <form onsubmit="submitLogin(event)">
          <div class="field"><label data-t="log.email"></label><input type="email" id="lmail" required></div>
          <div class="field"><label data-t="log.pw"></label><input type="password" id="lpw" required></div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-4px 0 22px;flex-wrap:wrap">
            <label style="display:flex;align-items:center;gap:8px;font-size:14.9px;color:var(--muted)">
              <input type="checkbox" checked><span data-t="log.remember"></span></label>
            <button type="button" class="linkbtn" style="font-size:14.9px" data-t="log.forgot"></button>
          </div>
          <button class="btn primary big" type="submit" style="width:100%" data-t="log.submit"></button>
        </form>
        <p style="font-size:14.9px;color:var(--muted);margin-top:22px">
          <span data-t="log.noacct"></span>
          <button class="linkbtn" style="font-size:14.9px;padding:0 0 0 4px" onclick="go('join')" data-t="nav.signup"></button>
        </p>
        <p style="font-size:13.8px;color:var(--faint);margin-top:26px" data-t="log.note"></p>
      </div>
    </div>
    <div class="loginside">
      <svg class="weavebg" viewBox="0 0 620 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="weavelogin"></svg>
      <p class="sq" data-t="foot.tag"></p>
    </div>
  </div>
</section>

<!-- ================= JOIN ================= -->
<section class="page" id="p-join">
  <div class="joinhero">
    <svg class="weave" viewBox="0 0 600 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="weavejoin"></svg>
    <div class="col">
      <div class="eyebrow" data-t="join.eyebrow"></div>
      <h1 data-t="join.title"></h1>
      <p class="lead" style="margin-top:18px" data-t="join.lead"></p>
    </div>
  </div>

  <div class="col" style="padding-bottom:70px">
    <div class="formgrid">
      <div class="formcard" id="formcard">
        <div class="stepsline" id="stepsline"></div>
        <form id="joinform" onsubmit="submitJoin(event)">
          <div class="field">
            <label data-t="join.fWho"></label>
            <div class="catgrid" id="joincats"></div>
          </div>
          <div class="field"><label data-t="join.fName"></label><input type="text" id="jname" required></div>
          <div class="field"><label data-t="join.fEmail"></label><input type="email" id="jmail" required></div>
          <div class="field"><label data-t="join.fBezirk"></label><select id="jdist"></select></div>
          <div class="field">
            <label data-t="join.fDisc"></label>
            <div class="pillset" id="jdisc"></div>
          </div>
          <div class="field">
            <label data-t="join.fLang"></label>
            <div class="pillset" id="jlang"></div>
          </div>
          <div class="field"><label data-t="join.fBio"></label><textarea id="jbio"></textarea></div>
          <button class="btn primary big" type="submit" data-t="join.submit"></button>
          <p style="font-size:13.8px;color:var(--faint);margin-top:14px" data-t="join.note"></p>
        </form>
      </div>

      <div class="aside">
        <div class="card">
          <div class="h" data-t="join.getH"></div>
          <div id="benefits"></div>
        </div>
        <div class="card">
          <div class="h" data-t="join.freeH"></div>
          <p style="font-size:14.9px;color:var(--muted);line-height:1.6" data-t="join.freeBody"></p>
        </div>
        <div class="card">
          <div class="h" data-t="join.recentH"></div>
          <div id="recent"></div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<footer class="site">
  <svg class="weavebg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="weavefoot"></svg>
  <div class="col">
    <div class="ftop">
      <div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="mark" style="width:38px;height:38px" role="img" aria-label="Plural"></span>
          <b style="font-size:20.8px;font-weight:600;letter-spacing:-.025em">Plural</b>
        </div>
        <p class="ftag" data-t="foot.tag"></p>
      </div>
      <div class="fcol"><h4 data-t="foot.c1"></h4>
        <button onclick="go('home')" data-t="nav.map"></button>
        <button onclick="go('events')" data-t="nav.events"></button>
        <button onclick="go('calls')" data-t="nav.calls"></button>
        <button onclick="go('about')" data-t="nav.about"></button>
        <button onclick="go('join')" data-t="nav.join"></button></div>
      <div class="fcol"><h4 data-t="foot.c2"></h4>
        <button onclick="go('calls')" data-t="foot.l1"></button><button data-t="foot.l2"></button><button data-t="foot.l3"></button></div>
      <div class="fcol"><h4 data-t="foot.c3"></h4>
        <button data-t="foot.l4"></button><button data-t="foot.l5"></button><button data-t="foot.l6"></button></div>
    </div>
    <div class="fbot">
      <span data-t="foot.copy"></span>
      <span class="mono" data-t="foot.made"></span>
    </div>
  </div>
</footer>

function smooth(p){
  let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){
    const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)} `+
       `${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)} `+
       `${c[0].toFixed(1)},${c[1].toFixed(1)}`;
  }
  return d;
}

/* ================== woven artwork ================== */
function weaveArt(id,cols,VW,VH,SP,W,seed){
  const s=document.getElementById(id); if(!s)return; s.innerHTML='';
  let sd=seed||99137; const R=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296;};
  const CX=VW/2, CY=VH/2, RAD=Math.hypot(VW,VH)/2+SP*2, T=RAD+SP*3;

  // every strand is a straight line with its own width and its own gap to the next:
  // irregular by hand, but strands inside a family stay parallel. Giving each strand
  // its own angle made neighbours converge and overlap further out, which read as a
  // strand changing width mid-run. The asymmetry comes from the gaps and widths.
  function family(baseAng){
    const arr=[]; let off=-RAD, prev=-1;
    while(off<=RAD){
      const ang=baseAng*Math.PI/180;
      const d=[Math.cos(ang),Math.sin(ang)], n=[-Math.sin(ang),Math.cos(ang)];
      let ci; do{ci=Math.floor(R()*cols.length);}while(ci===prev&&cols.length>1); prev=ci;
      arr.push({o:[CX+n[0]*off,CY+n[1]*off],d,c:cols[ci],w:W*(0.78+R()*0.5)});
      off+=SP*(0.80+R()*0.46);
    }
    return arr;
  }
  const FA=family(0), FB=family(90);

  const meet=(A,B)=>{                       // exact intersection of two straight strands
    const den=A.d[0]*B.d[1]-A.d[1]*B.d[0];
    const ex=B.o[0]-A.o[0], ey=B.o[1]-A.o[1];
    return [ (ex*B.d[1]-ey*B.d[0])/den, (ex*A.d[1]-ey*A.d[0])/den ];  // [tA, tB]
  };
  const TB=FB.map(()=>[]);                  // crossing parameters along each B strand
  for(let i=0;i<FB.length;i++)for(let j=0;j<FA.length;j++)TB[i][j]=meet(FA[j],FB[i])[1];

  const pt=(L,t)=>[(L.o[0]+L.d[0]*t).toFixed(1),(L.o[1]+L.d[1]*t).toFixed(1)];
  const line=(L,a,b)=>`M${pt(L,a).join(',')} L${pt(L,b).join(',')}`;

  const frame=el('g'), rot=el('g',{transform:'rotate(45 '+CX+' '+CY+')'});
  const stroke=(d,c,w,cap)=>rot.appendChild(
    el('path',{d,stroke:c,'stroke-width':w,fill:'none','stroke-linecap':cap||'round'}));

  FB.forEach(L=>stroke(line(L,-T,T),L.c,L.w));
  FA.forEach(L=>stroke(line(L,-T,T),L.c,L.w));
  // the strand on top is redrawn from midpoint to midpoint of its neighbouring
  // crossings, so it always covers its crossing and never touches the next one
  for(let i=0;i<FB.length;i++){
    const ts=TB[i];
    for(let j=0;j<FA.length;j++){
      if((i+j)%2)continue;
      const t=ts[j];
      const back=j>0?(t-ts[j-1])*0.46:SP*0.46;
      const fwd=j<ts.length-1?(ts[j+1]-t)*0.46:SP*0.46;
      stroke(line(FB[i],t-back,t+fwd),FB[i].c,FB[i].w,'butt');
    }
  }

  const defs=el('defs'), f=el('clipPath',{id:id+'-f'});
  f.appendChild(el('rect',{x:0,y:0,width:VW,height:VH}));
  defs.appendChild(f); s.appendChild(defs);
  frame.setAttribute('clip-path','url(#'+id+'-f)');
  frame.appendChild(rot); s.appendChild(frame);
}

/* ================== woven background pattern ================== */
function weave(svg,cols,step,w){
  const s=document.getElementById(svg); if(!s)return; s.innerHTML='';
  const vb=s.getAttribute('viewBox').split(' ').map(Number);
  const len=step*1.5;
  for(let i=-2;i<vb[2]/step+4;i++){
    for(let j=-2;j<vb[3]/step+4;j++){
      if((i+j)%2)continue;
      const x=i*step, y=j*step;
      // two crossing bars per cell, the identity's woven lattice
      [[-45,0],[45,1]].forEach(([dir,k])=>{
        const c=cols[(i*3+j*5+k*2+12)%cols.length];
        const cx=x+(k?step*.34:-step*.06), cy=y+(k?-step*.06:step*.34);
        s.appendChild(el('rect',{x:cx,y:cy,width:w,height:len,rx:w/2.3,fill:c,
          transform:`rotate(${dir} ${cx+w/2} ${cy+len/2})`}));
      });
    }
  }
}

/* ================== camera ================== */
const FULL=[0,0,1000,822];
let vb=FULL.slice(), vbRAF=null;
const REDUCED=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function setVB(v){map.setAttribute('viewBox',v.map(n=>n.toFixed(1)).join(' '));
  map.style.setProperty('--z',(1000/v[2]).toFixed(3));}
function tweenVB(to,ms){
  if(REDUCED){vb=to.slice();setVB(vb);return;}
  cancelAnimationFrame(vbRAF);
  const from=vb.slice(), t0=performance.now();
  (function step(now){
    const k=Math.min(1,(now-t0)/ms), e=ease(k);
    vb=from.map((n,i)=>n+(to[i]-n)*e); setVB(vb);
    if(k<1)vbRAF=requestAnimationFrame(step);
  })(performance.now());
}
function focusPin(i){
  if(REDUCED)return;
  const p=P[i], f=FEAT[p.n];
  const cx=f?(p.x+f[0])/2:p.x, cy=f?(p.y+f[1])/2:p.y;
  const w=470, h=w*822/1000;
  tweenVB([Math.max(0,Math.min(1000-w,cx-w/2)),Math.max(0,Math.min(822-h,cy-h/2)),w,h],760);
}
const resetView=()=>tweenVB(FULL,760);

/* pan and zoom, like any slippy map */
const AR=822/1000;
function clampVB(v){
  const w=Math.min(1000,Math.max(150,v[2])), h=w*AR;
  const px=w*0.16, py=h*0.16;               // a little give, so a drag always moves something
  return [Math.min(1000-w+px,Math.max(-px,v[0])),Math.min(822-h+py,Math.max(-py,v[1])),w,h];
}
function ptVB(ev){
  const r=map.getBoundingClientRect(), sc=Math.min(r.width/vb[2],r.height/vb[3]);
  const ox=(r.width-vb[2]*sc)/2, oy=(r.height-vb[3]*sc)/2;
  return [vb[0]+(ev.clientX-r.left-ox)/sc, vb[1]+(ev.clientY-r.top-oy)/sc, sc];
}
function zoomAt(f,cx,cy){
  cancelAnimationFrame(vbRAF);
  vb=clampVB([cx-(cx-vb[0])*f, cy-(cy-vb[1])*f, vb[2]*f, 0]); setVB(vb);
}
function zoomBy(f){ zoomAt(f, vb[0]+vb[2]/2, vb[1]+vb[3]/2); }
let justDragged=false;
(function panzoom(){
  const w=document.querySelector('.mapwrap'); let drag=null;
  w.addEventListener('wheel',e=>{e.preventDefault();const p=ptVB(e);
    zoomAt(e.deltaY>0?1.13:0.885,p[0],p[1]);},{passive:false});
  // the drag starts anywhere, pins included: a pin only opens if the pointer barely moved
  w.addEventListener('pointerdown',e=>{
    if(e.target.closest('.mapctl'))return;
    justDragged=false; cancelAnimationFrame(vbRAF);
    const p=ptVB(e); drag={x:e.clientX,y:e.clientY,sc:p[2],v:vb.slice(),moved:0,id:e.pointerId,cap:false};
  });
  w.addEventListener('pointermove',e=>{ if(!drag)return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
    if(drag.moved<4)return;
    // capture only once it is really a drag: capturing on pointerdown would steal the pin's click
    if(!drag.cap){drag.cap=true; try{w.setPointerCapture(drag.id);}catch(err){}}
    w.classList.add('dragging');
    vb=clampVB([drag.v[0]-dx/drag.sc, drag.v[1]-dy/drag.sc, drag.v[2],0]);
    setVB(vb);});
  const end=()=>{ if(drag&&drag.moved>=4)justDragged=true;
    drag=null; w.classList.remove('dragging'); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>w.addEventListener(t,end));
  w.addEventListener('click',e=>{ if(justDragged){justDragged=false;
    e.stopPropagation(); e.preventDefault();} },true);
})();

  });

// frame the results: typing a Bezirk flies the map to it
function fitTo(vis){
  if(REDUCED||!vis.length){if(!vis.length)return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  vis.forEach(({p})=>{
    const f=FEAT[p.n], pts=f?[[p.x,p.y],[f[0],f[1]]]:[[p.x,p.y]];
    pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});
  });
  const pad=76, AR=1000/822;
  let w=Math.max(x1-x0+pad*2,300), h=Math.max(y1-y0+pad*2,300/AR);
  if(w/h<AR)w=h*AR; else h=w/AR;
  w=Math.min(w,1000); h=Math.min(h,822);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  tweenVB([Math.max(0,Math.min(1000-w,cx-w/2)),Math.max(0,Math.min(822-h,cy-h/2)),w,h],780);
}

const BEZIRK_LABELS=['Mitte','Friedrichshain-Kreuzberg','Pankow','Charlottenburg-Wilmersdorf','Spandau',
 'Steglitz-Zehlendorf','Tempelhof-Schöneberg','Neukölln','Treptow-Köpenick','Marzahn-Hellersdorf','Lichtenberg'];
let INDEX=[];
function buildIndex(){
  const seen=new Set(), out=[];
  const add=(label,kind,c)=>{const k=kind+'|'+label.toLowerCase();
    if(label&&!seen.has(k)){seen.add(k);out.push({label,kind,c});}};
  BEZIRK_LABELS.forEach(b=>add(b,'bezirk'));
  P.forEach(p=>{ if(p.b!=='Berlin-wide')add(p.b,'bezirk'); });
  P.forEach(p=>add(p.n,'member',CAT[p.c].c));
  P.forEach(p=>add(TY[p.t][L],'type'));
  P.forEach(p=>p.g.forEach(g=>add(TAG[g][L],'tag')));
  INDEX=out;
}
function suggest(qs){
  const q=qs.trim().toLowerCase(); if(!q)return[];
  const pre=[],mid=[];
  INDEX.forEach(it=>{const l=it.label.toLowerCase();
    if(l.startsWith(q))pre.push(it); else if(l.includes(q))mid.push(it);});
  const rank={bezirk:0,member:1,type:2,tag:3};
  pre.sort((a,b)=>rank[a.kind]-rank[b.kind]||a.label.length-b.label.length);
  return pre.concat(mid).slice(0,7);
}
const qEl=document.getElementById('q'), sugEl=document.getElementById('sug');
let sugList=[], sugAt=-1, lastVal='', fitT=null;
const setClear=()=>document.querySelector('.searchwrap').classList.toggle('filled',!!qEl.value);
function clearSearch(){
  qEl.value='';lastVal='';query='';sel=null;setClear();closeSug();render();resetView();qEl.focus();
}

function drawSug(){
  if(!sugList.length){closeSug();return;}
  sugEl.innerHTML=sugList.map((it,i)=>{
    const q=qEl.value.trim().toLowerCase(), l=it.label, at=l.toLowerCase().indexOf(q);
    const marked=at<0?esc(l):esc(l.slice(0,at))+'<b>'+esc(l.slice(at,at+q.length))+'</b>'+esc(l.slice(at+q.length));
    return `<button type="button" class="sugit${i===sugAt?' act':''}" style="--c:${it.c||'var(--faint)'}"
      onmousedown="event.preventDefault()" onclick="useSug(${i})">
      ${it.kind==='member'?'<span class="dot"></span>':''}<span>${marked}</span>
      <span class="k">${t('sug.'+it.kind)}</span></button>`;}).join('');
  sugEl.classList.add('on'); qEl.setAttribute('aria-expanded','true');
}
function closeSug(){sugEl.classList.remove('on');qEl.setAttribute('aria-expanded','false');sugAt=-1;}
function applyQuery(v,fit){
  query=v; sel=null; render();
  clearTimeout(fitT);
  fitT=setTimeout(()=>{ query.trim()?fitTo(visible()):resetView(); },fit?60:340);
}
function useSug(i){
  const it=sugList[i]; if(!it)return;
  qEl.value=it.label; lastVal=it.label; setClear(); closeSug(); applyQuery(it.label,true); qEl.blur();
}
qEl.oninput=e=>{
  const raw=e.target.value, growing=raw.length>lastVal.length;
  sugList=suggest(raw); sugAt=-1;
  let val=raw;
  if(growing&&raw.trim()){                         // finish the word inline, selected
    const m=sugList.find(x=>x.label.toLowerCase().startsWith(raw.toLowerCase()));
    if(m&&m.label.length>raw.length){
      e.target.value=m.label; e.target.setSelectionRange(raw.length,m.label.length); val=m.label;
    }
  }
  lastVal=raw; setClear(); drawSug(); applyQuery(val,false);
};
qEl.onkeydown=e=>{
  if(!sugEl.classList.contains('on'))return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault(); sugAt=(sugAt+(e.key==='ArrowDown'?1:sugList.length-1))%sugList.length; drawSug();
  }else if(e.key==='Enter'){ if(sugAt>=0){e.preventDefault();useSug(sugAt);} else closeSug(); }
  else if(e.key==='Escape'){ closeSug(); }
};
qEl.onfocus=()=>{ if(qEl.value.trim()){sugList=suggest(qEl.value);drawSug();} };
qEl.onblur=()=>setTimeout(closeSug,120);
document.getElementById('showall').onclick=()=>{
  Object.keys(CAT).forEach(k=>active.add(k));
  clearSearch();qEl.blur();};

/* ---------- results as a bottom sheet on the phone ---------- */
(function sheet(){
  const rail=document.querySelector('.rail'), grip=document.getElementById('grip');
  const peek=()=>rail.offsetHeight-156, open=()=>rail.offsetHeight*0.06;
  window.setSheet=o=>{ if(!isPhone())return;
    rail.style.setProperty('--sheet',(o?open():peek())+'px'); rail.dataset.open=o?'1':''; };
  let d=null;
  grip.addEventListener('pointerdown',e=>{
    if(!isPhone())return;
    const cur=rail.dataset.open?open():peek();
    d={y:e.clientY,start:cur}; rail.classList.add('dragging');
    try{grip.setPointerCapture(e.pointerId);}catch(err){}
  });
  grip.addEventListener('pointermove',e=>{ if(!d)return;
    const v=Math.max(open(),Math.min(peek(),d.start+(e.clientY-d.y)));
    rail.style.setProperty('--sheet',v+'px'); });
  const end=e=>{ if(!d)return;
    const v=Math.max(open(),Math.min(peek(),d.start+((e.clientY||d.y)-d.y)));
    const moved=Math.abs(v-d.start);
    rail.classList.remove('dragging');
    setSheet(moved<6 ? !rail.dataset.open : v<(peek()+open())/2);
    d=null; };
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>grip.addEventListener(t,end));
  addEventListener('resize',()=>setSheet(!!rail.dataset.open));
})();
